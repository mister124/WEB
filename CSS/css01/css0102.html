<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 02 - Embedded Style Sheet</title>

    <!--
    ==================================================
    CSS-1 02 : Embedded Style Sheet / Selector / Class / ID
    ==================================================

    이번 파일 핵심:

    1. <style>
       -> HTML 문서 안에 CSS 작성

    2. selector
       -> 어떤 HTML 요소에 CSS를 적용할지 선택

    3. element selector
       -> 태그 이름으로 선택

    4. class selector
       -> .class이름

    5. id selector
       -> #id이름
    -->

    <!--
    ==================================================
    1. Embedded Style Sheet
    ==================================================

    <style> 태그 안에 CSS를 작성한다.

    일반적으로 <head> 안에 작성한다.

    기본 구조:

    <style>

        selector {
            property: value;
        }

    </style>
    -->

    <style>
      /*
        ==================================================
        2. Element Selector
        ==================================================

        p {
            ...
        }

        -> 모든 <p> 요소를 선택

        selector = p
        */

      p {
        font-size: 25px;
        color: blue;
      }

      /*
        h1 selector

        -> 모든 h1에 적용
        */

      h1 {
        font-size: 40px;
        color: navy;
      }

      /*
        ==================================================
        3. Class Selector
        ==================================================

        class selector는 점(.)으로 시작

        .special {
            ...
        }

        HTML:

        <p class="special">

        class는 여러 요소에
        같은 스타일을 적용할 때 사용 가능
        */

      .special {
        color: orange;
        font-weight: bold;
      }

      /*
        같은 class를
        서로 다른 HTML 태그에도 적용 가능

        예:

        <p class="important">
        <h2 class="important">
        */

      .important {
        color: red;
        font-size: 24px;
      }

      /*
        ==================================================
        4. ID Selector
        ==================================================

        id selector는 #으로 시작

        #main-title {
            ...
        }

        HTML:

        <h2 id="main-title">

        id는 한 페이지에서
        특정 요소 하나를 식별하는 데 사용
        */

      #main-title {
        color: red;
        font-size: 50px;
      }

      /*
        ==================================================
        5. 여러 property
        ==================================================

        CSS rule:

        selector {
            property: value;
            property: value;
        }
        */

      #notice {
        color: brown;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>Embedded Style Sheet 실습</h1>

    <!--
    ==================================================
    Element Selector 확인
    ==================================================

    CSS에서:

    p {
        font-size: 18px;
        color: blue;
    }

    라고 했으므로

    아래 모든 p가
    자동으로 같은 스타일을 받는다.
    -->

    <h2>1. Element Selector</h2>

    <p>첫 번째 문단입니다.</p>

    <p>두 번째 문단입니다.</p>

    <p>세 번째 문단입니다.</p>

    <!--
    ==================================================
    Class Selector 확인
    ==================================================

    class="special"

    CSS에서는:

    .special

    점(.)을 붙여 선택한다.
    -->

    <h2>2. Class Selector</h2>

    <p class="special">special class가 적용된 문장입니다.</p>

    <p>일반 p 문장입니다.</p>

    <p class="special">이 문장도 같은 special class가 적용됩니다.</p>

    <!--
    class는 p가 아닌 다른 요소에도
    같은 이름을 사용할 수 있다.
    -->

    <h3 class="special">h3 요소에도 special class 적용</h3>

    <!--
    ==================================================
    또 다른 class
    ==================================================
    -->

    <p class="important">중요한 문장입니다.</p>

    <h2 class="important">중요한 제목입니다.</h2>

    <!--
    ==================================================
    ID Selector 확인
    ==================================================

    id="main-title"

    CSS에서는:

    #main-title

    #을 붙여 선택한다.
    -->

    <h2 id="main-title">3. ID Selector</h2>

    <p id="notice">이 문장은 notice라는 id를 사용합니다.</p>

    <!--
    ==================================================
    ★ class와 id 차이
    ==================================================

    class
    -> 여러 요소에 같은 스타일 적용 가능

    HTML:
    class="special"

    CSS:
    .special


    id
    -> 페이지 안의 특정 요소를 식별

    HTML:
    id="main-title"

    CSS:
    #main-title
    -->
  </body>
</html>
