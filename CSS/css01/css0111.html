<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 4.12 Drop-Down Menu</title>

    <style>
      /* ==================================================
           전체 페이지
           ================================================== */

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* ==================================================
           상단 메뉴 전체
           ================================================== */

      .menu {
        background-color: #333;
      }

      /* ==================================================
           ul 기본 스타일 제거
           ================================================== */

      .menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* ==================================================
           1단계 메뉴

           > 는 "바로 아래 자식"이라는 의미
           ================================================== */

      .menu > ul {
        display: flex;
      }

      /* ==================================================
           각각의 메뉴 항목
           ================================================== */

      .menu li {
        position: relative;
      }

      /* ==================================================
           메뉴 링크
           ================================================== */

      .menu a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 15px 20px;
      }

      /* ==================================================
           마우스를 올렸을 때

           :hover
           → 마우스 커서가 해당 요소 위에 있을 때
           ================================================== */

      .menu a:hover {
        background-color: #555;
      }

      /* ==================================================
           하위 메뉴

           평소에는 숨김
           ================================================== */

      .submenu {
        display: none;

        position: absolute;

        top: 100%;
        left: 0;

        min-width: 150px;

        background-color: #444;
      }

      /* ==================================================
           핵심 부분

           1단계 메뉴에 마우스를 올리면
           그 안의 .submenu를 보여줌
           ================================================== */

      .menu li:hover .submenu {
        display: block;
      }

      /* ==================================================
           하위 메뉴 링크
           ================================================== */

      .submenu a {
        padding: 12px 15px;
      }

      /* ==================================================
           본문
           ================================================== */

      main {
        padding: 30px;
      }
    </style>
  </head>

  <body>
    <!-- ================================================
         메뉴
         ================================================ -->

    <nav class="menu">
      <ul>
        <!-- 일반 메뉴 -->
        <li>
          <a href="#">홈</a>
        </li>

        <!-- 드롭다운 메뉴 -->
        <li>
          <a href="#">게임</a>

          <!-- 처음에는 display:none -->
          <ul class="submenu">
            <li>
              <a href="#">RPG</a>
            </li>

            <li>
              <a href="#">FPS</a>
            </li>

            <li>
              <a href="#">스포츠</a>
            </li>
          </ul>
        </li>

        <!-- 일반 메뉴 -->
        <li>
          <a href="#">공지사항</a>
        </li>

        <!-- 일반 메뉴 -->
        <li>
          <a href="#">로그인</a>
        </li>
      </ul>
    </nav>

    <!-- ================================================
         본문
         ================================================ -->

    <main>
      <h1>CSS Drop-Down Menu</h1>

      <p>위의 "게임" 메뉴에 마우스를 올려보세요.</p>

      <p>하위 메뉴가 나타나는 것을 확인할 수 있습니다.</p>
    </main>
  </body>
</html>
