<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 05 - Pseudo Class and Length Units</title>

    <style>
      /*
        ==================================================
        CSS-1 05
        Pseudo-class / CSS Length Units
        ==================================================

        이번 파일 핵심:

        1. :link
           아직 방문하지 않은 링크

        2. :visited
           방문한 링크

        3. :hover
           마우스를 올린 상태

        4. :active
           링크를 클릭하고 있는 순간

        5. px
           고정적인 길이 단위

        6. em
           주변 font-size를 기준으로 계산

        7. rem
           root(html)의 font-size 기준

        8. %
           부모 요소 등을 기준으로 비율 계산

        9. vw / vh
           브라우저 화면(viewport) 기준
        */

      /*
        ==================================================
        1. Link Pseudo-class
        ==================================================

        기본 형태:

        selector:pseudo-class {
            property: value;
        }

        a:link
        a:visited
        a:hover
        a:active
        */

      /*
        아직 방문하지 않은 링크
        */

      a:link {
        color: red;
        text-decoration: none;
      }

      /*
        이미 방문한 링크
        */

      a:visited {
        color: green;
      }

      /*
        마우스 커서를 올렸을 때
        */

      a:hover {
        color: magenta;
        text-decoration: underline;
        background-color: lightyellow;
      }

      /*
        링크를 클릭하고 있는 순간
        */

      a:active {
        color: blue;
      }

      /*
        ==================================================
        2. px
        ==================================================

        px
        -> pixel

        강의자료에서는 absolute length로 분류.

        예:
        font-size: 20px;
        width: 300px;
        */

      .pixel {
        font-size: 24px;
      }

      /*
        ==================================================
        3. em
        ==================================================

        em은 font-size 등을 기준으로
        상대적으로 계산되는 단위.

        부모가 20px이고
        자식 font-size가 1.5em이면:

        20px × 1.5 = 30px
        */

      .em-parent {
        font-size: 30px;
      }

      .em-child {
        font-size: 1.5em;
      }

      /*
        ==================================================
        4. rem
        ==================================================

        rem
        = root em

        root element인 html의
        font-size를 기준으로 계산.

        html = 16px

        1.5rem
        = 16 × 1.5
        = 24px
        */

      html {
        font-size: 16px;
      }

      .rem-example {
        font-size: 1.5rem;
      }

      /*
        ==================================================
        5. %
        ==================================================

        %
        -> 부모 요소 등의 크기를 기준으로
           비율을 지정할 때 사용

        width: 50%;
        -> 부모 너비의 절반
        */

      .parent-box {
        width: 600px;
        border: 2px solid black;
      }

      .percent-box {
        width: 50%;
        background-color: lightblue;
      }

      /*
        ==================================================
        6. vw
        ==================================================

        vw = viewport width

        1vw
        = 현재 브라우저 화면 너비의 1%

        50vw
        = 화면 너비의 50%
        */

      .vw-box {
        width: 50vw;
        background-color: lightgreen;
      }

      /*
        ==================================================
        7. vh
        ==================================================

        vh = viewport height

        1vh
        = 브라우저 화면 높이의 1%

        10vh
        = 화면 높이의 10%
        */

      .vh-box {
        height: 10vh;
        background-color: lightpink;
      }
    </style>
  </head>

  <body>
    <h1>Pseudo-class와 CSS Length Unit</h1>

    <!--
    ==================================================
    1. Link Pseudo-class 실습
    ==================================================
    -->

    <h2>1. Link Pseudo-class</h2>

    <p>아래 링크에 마우스를 올려보세요.</p>

    <p>
      <a href="https://example.com"> Example 사이트 </a>
    </p>

    <p>
      <a href="https://www.w3.org"> W3C 사이트 </a>
    </p>

    <hr />

    <!--
    ==================================================
    2. px
    ==================================================
    -->

    <h2>2. px</h2>

    <p class="pixel">이 글자는 24px입니다.</p>

    <hr />

    <!--
    ==================================================
    3. em
    ==================================================

    부모:
    20px

    자식:
    1.5em

    결과:
    30px
    -->

    <h2>3. em</h2>

    <div class="em-parent">
      부모 글자 크기: 20px

      <p class="em-child">자식 글자 크기: 1.5em</p>
    </div>

    <hr />

    <!--
    ==================================================
    4. rem
    ==================================================

    html:
    16px

    1.5rem:
    24px
    -->

    <h2>4. rem</h2>

    <p class="rem-example">이 글자는 1.5rem입니다.</p>

    <hr />

    <!--
    ==================================================
    5. %
    ==================================================
    -->

    <h2>5. Percent</h2>

    <div class="parent-box">
      부모 영역: 600px

      <div class="percent-box">나는 부모의 50%</div>
    </div>

    <hr />

    <!--
    ==================================================
    6. vw
    ==================================================
    -->

    <h2>6. vw</h2>

    <div class="vw-box">이 영역의 width는 50vw입니다.</div>

    <hr />

    <!--
    ==================================================
    7. vh
    ==================================================
    -->

    <h2>7. vh</h2>

    <div class="vh-box">이 영역의 height는 10vh입니다.</div>
  </body>
</html>
