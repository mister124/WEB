<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Pseudo-elements</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      /* =========================================
           1. ::first-line

           요소에서 실제 화면에 표시되는
           첫 번째 줄만 선택
           ========================================= */

      .intro {
        width: 400px;
      }

      .intro::first-line {
        color: blue;
        font-weight: bold;
        font-size: 20px;
      }

      /* =========================================
           2. ::before

           요소 내용 앞에 가상 요소 생성

           content가 사실상 핵심
           ========================================= */

      .before::before {
        content: "★ ";

        color: red;
      }

      /* =========================================
           3. ::after

           요소 내용 뒤에 가상 요소 생성
           ========================================= */

      .after::after {
        content: " ✓";

        color: green;
      }

      /* =========================================
           4. ::marker

           ul/ol의 bullet 또는 번호 부분
           ========================================= */

      li::marker {
        color: crimson;
        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <h1>CSS Pseudo-element 실습</h1>

    <h2>1. ::first-line</h2>

    <p class="intro">
      이 문장은 여러 줄로 표시됩니다. 브라우저의 너비와 요소의 width에 따라 첫
      번째 줄이 달라질 수 있습니다. ::first-line은 실제 화면에서 첫 번째 줄에만
      스타일을 적용합니다.
    </p>

    <h2>2. ::before</h2>

    <p class="before">중요한 내용</p>

    <h2>3. ::after</h2>

    <p class="after">과제 완료</p>

    <h2>4. ::marker</h2>

    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>

    <ol>
      <li>첫 번째 단계</li>
      <li>두 번째 단계</li>
      <li>세 번째 단계</li>
    </ol>
  </body>
</html>
