<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 5.4 Box Shadows</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      /* =========================================
           공통 박스
           ========================================= */

      .box {
        width: 250px;

        padding: 30px;

        margin-bottom: 50px;

        border: 2px solid black;

        background-color: lightcyan;

        text-align: center;
      }

      /* =========================================
           1. 기본 box-shadow

           순서:
           box-shadow:
               horizontal-offset
               vertical-offset
               blur-radius
               color;
           ========================================= */

      .shadow1 {
        box-shadow: -5px 5px 10px gray;
      }

      /* =========================================
           2. 가로 offset이 음수

           첫 번째 값이 음수
           → 그림자가 왼쪽으로 이동
           ========================================= */

      .shadow2 {
        box-shadow: -5px 5px 10px gray;
      }

      /* =========================================
           3. 세로 offset이 음수

           두 번째 값이 음수
           → 그림자가 위쪽으로 이동
           ========================================= */

      .shadow3 {
        box-shadow: 5px -5px 10px gray;
      }

      /* =========================================
           4. blur-radius = 0

           흐림 효과 없음
           ========================================= */

      .shadow4 {
        box-shadow: 5px 5px 0 black;
      }

      /* =========================================
           5. 큰 blur-radius

           값이 커지면 그림자의 가장자리가
           더 많이 흐려짐
           ========================================= */

      .shadow5 {
        box-shadow: 5px 5px 25px gray;
      }
    </style>
  </head>

  <body>
    <h1>CSS Box Shadow 실습</h1>

    <div class="box shadow1">box-shadow: 5px 5px 10px gray;</div>

    <div class="box shadow2">box-shadow: -5px 5px 10px gray;</div>

    <div class="box shadow3">box-shadow: 5px -5px 10px gray;</div>

    <div class="box shadow4">box-shadow: 5px 5px 0 black;</div>

    <div class="box shadow5">box-shadow: 5px 5px 25px gray;</div>
  </body>
</html>
