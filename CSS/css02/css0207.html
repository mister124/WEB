<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 5.7 Text Stroke</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      /* =========================================
           1. PPT 기본 예제

           -webkit-text-stroke:
               외곽선 두께
               외곽선 색상
           ========================================= */

      .stroke1 {
        color: lightcyan;

        -webkit-text-stroke: 2px black;

        font-size: 500%;
      }

      /* =========================================
           2. 외곽선을 더 얇게
           ========================================= */

      .stroke2 {
        color: lightcyan;

        -webkit-text-stroke: 1px black;

        font-size: 500%;
      }

      /* =========================================
           3. 외곽선을 더 두껍게
           ========================================= */

      .stroke3 {
        color: lightcyan;

        -webkit-text-stroke: 5px black;

        font-size: 500%;
      }

      /* =========================================
           4. Stroke 색상 변경
           ========================================= */

      .stroke4 {
        color: yellow;

        -webkit-text-stroke: 3px red;

        font-size: 500%;
      }
    </style>
  </head>

  <body>
    <h1>CSS Text Stroke 실습</h1>

    <p class="stroke1">Text</p>

    <p class="stroke2">Thin</p>

    <p class="stroke3">Thick</p>

    <p class="stroke4">Color</p>
  </body>
</html>
