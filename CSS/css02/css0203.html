<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS 5.3 Color</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      .box {
        width: 300px;
        padding: 20px;
        margin-bottom: 20px;
        border: 2px solid black;
      }

      /* =========================================
           1. 색상 이름
           ========================================= */

      .name-color {
        background-color: red;
        color: white;
      }

      /* =========================================
           2. 16진수 RGB
           #RRGGBB
           ========================================= */

      .hex-color {
        background-color: #00ffff;
      }

      /* =========================================
           3. RGB

           rgb(red, green, blue)

           각 값의 범위:
           0 ~ 255
           ========================================= */

      .rgb-color {
        background-color: rgb(0, 0, 255);
        color: white;
      }

      /* =========================================
           4. RGBA

           rgba(red, green, blue, alpha)

           alpha:
           0.0 → 완전 투명
           1.0 → 완전 불투명
           ========================================= */

      .rgba-color {
        background-color: rgba(255, 0, 0, 0.1);
      }

      /* =========================================
           5. HSL

           hsl(hue, saturation, lightness)
           ========================================= */

      .hsl-color {
        background-color: hsl(240, 100%, 50%);
      }

      /* =========================================
           6. HSLA

           hsla(hue, saturation, lightness, alpha)
           ========================================= */

      .hsla-color {
        background-color: hsla(0, 100%, 50%, 0.5);
      }
    </style>
  </head>

  <body>
    <h1>CSS Color 실습</h1>

    <div class="box name-color">color name: red</div>

    <div class="box hex-color">hexadecimal: #00FFFF</div>

    <div class="box rgb-color">rgb(255, 0, 0)</div>

    <div class="box rgba-color">rgba(255, 0, 0, 0.5)</div>

    <div class="box hsl-color">hsl(120, 100%, 50%)</div>

    <div class="box hsla-color">hsla(0, 100%, 50%, 0.5)</div>
  </body>
</html>
