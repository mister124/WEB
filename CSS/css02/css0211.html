<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS Animation</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }

      /* =========================================
           애니메이션이 일어날 영역
           ========================================= */

      .stage {
        position: relative;

        width: 300px;
        height: 300px;

        border: 1px solid black;
      }

      /* =========================================
           움직이는 요소
           ========================================= */

      .moving-box {
        position: relative;

        width: 80px;
        height: 80px;

        background-color: steelblue;

        color: white;

        text-align: center;
        line-height: 80px;

        /* =====================================
               animation shorthand

               animation-name
               timing-function
               duration
               delay
               iteration-count
               direction
               ===================================== */

        animation: movingBox linear 10s 1s 2 alternate;
      }

      /* =========================================
           animation의 각 시점 정의
           ========================================= */

      @keyframes movingBox {
        0% {
          opacity: 0;
          left: 100px;
          top: 0;
        }

        25% {
          opacity: 1;
          left: 0;
          top: 100px;
        }

        50% {
          opacity: 0;
          left: 100px;
          top: 200px;
        }

        75% {
          opacity: 1;
          left: 200px;
          top: 100px;
        }

        100% {
          opacity: 0;
          left: 100px;
          top: 0;
        }
      }
    </style>
  </head>

  <body>
    <h1>CSS Animation 실습</h1>

    <div class="stage">
      <div class="moving-box">BOX</div>
    </div>
  </body>
</html>
