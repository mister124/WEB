<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>HTML-2 Study</title>
  </head>

  <body>
    <!--
    ==================================================
    HTML-2 : Introduction to HTML5 Part 2
    ==================================================

    [목적]

    - HTML-2 내용을 한 파일에서 관리
    - 실행 가능한 실습 코드 작성
    - 시험 핵심 내용을 주석으로 기록


    [기출 핵심]

    날짜를 달력에서 선택
    -> type="date"

    숫자만 입력
    -> type="number"

    필수 입력
    -> required
    -->

    <h1>HTML-2 Study</h1>

    <!--
    ==================================================
    1. HTML5 FORM INPUT TYPES
    ==================================================

    <input type="...">

    type에 따라
    입력받는 데이터 종류와 브라우저 UI가 달라진다.
    -->

    <hr />

    <h2>1. HTML5 Form Input Types</h2>

    <form>
      <!--
        --------------------------------------------------
        type="text"
        --------------------------------------------------

        일반 문자열 입력.
        -->

      <p>
        <label for="name">이름:</label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="이름을 입력하세요"
          required
          autofocus
        />
      </p>

      <!--
        --------------------------------------------------
        type="date"
        --------------------------------------------------

        날짜 입력.

        시험:
        "생년월일을 달력에서 선택"
        "제출기한을 달력에서 선택"

        -> type="date"
        -->

      <p>
        <label for="birth">생년월일:</label>

        <input type="date" id="birth" name="birth" required />
      </p>

      <!--
        --------------------------------------------------
        type="number"
        --------------------------------------------------

        숫자 입력.

        시험:
        "숫자만 입력 가능"
        -> type="number"

        min  : 최소값
        max  : 최대값
        step : 숫자 단위
        -->

      <p>
        <label for="height">키:</label>

        <input
          type="number"
          id="height"
          name="height"
          min="50"
          max="250"
          step="0.1"
          required
        />
      </p>

      <p>
        <label for="weight">체중:</label>

        <input
          type="number"
          id="weight"
          name="weight"
          min="1"
          max="500"
          step="0.1"
          required
        />
      </p>

      <!--
        --------------------------------------------------
        type="email"
        --------------------------------------------------

        이메일 입력.

        브라우저가 이메일 형식인지 검사한다.

        실제 이메일 주소가 존재하는지는 확인하지 않는다.
        -->

      <p>
        <label for="email">이메일:</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@gmail.com"
          required
        />
      </p>

      <!--
        --------------------------------------------------
        type="color"
        --------------------------------------------------

        색상 선택용 input.

        시험 중요도는 현재 비교적 낮음.
        -->

      <p>
        <label for="favoriteColor"> 좋아하는 색: </label>

        <input type="color" id="favoriteColor" name="favoriteColor" />
      </p>

      <!--
        --------------------------------------------------
        required
        --------------------------------------------------

        필수 입력.

        빈 상태로 submit하면
        브라우저가 제출을 막는다.

        HTML 브라우저 검증 기능.

        시험에서 alert() 경고창을 직접 요구하면
        JavaScript 검증이 별도로 필요할 수 있다.
        -->

      <!--
        --------------------------------------------------
        placeholder
        --------------------------------------------------

        입력 예시.

        실제 value가 아니다.
        입력 데이터로 전송되는 값이 아니다.
        -->

      <!--
        --------------------------------------------------
        autofocus
        --------------------------------------------------

        페이지가 열리자마자
        해당 입력 요소에 포커스를 준다.

        현재 시험 중요도 낮음.
        -->

      <input type="submit" value="입력" />
    </form>
  </body>
</html>
