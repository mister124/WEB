<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>HTML-1 특수문자와 목록</title>
  </head>

  <body>
    <!--
    ==================================================
    HTML-1 02 : Character Entity / Text / List
    ==================================================
    -->

    <h1>특수문자와 목록</h1>

    <!--
    ==================================================
    1. Character Entity Reference
    ==================================================

    HTML에서 특별한 의미를 가진 문자를
    화면에 출력할 때 사용.

    &lt;    -> <
    &gt;    -> >
    &amp;   -> &
    &apos;  -> '
    &quot;  -> "
    &nbsp;  -> 공백
    &copy;  -> ©
    &mdash; -> 긴 대시
    &ndash; -> 짧은 대시
    -->

    <h2>Character Entity</h2>

    <p>&lt;html&gt;</p>

    <p>HTML &amp; CSS</p>

    <p>&copy; 2026</p>

    <!--
    ==================================================
    2. hr / del / sub / sup
    ==================================================
    -->

    <!-- 수평 구분선 -->
    <hr />

    <!--
    del
    -> 삭제되었거나 취소된 내용
    -->

    <p>
      원래 가격:
      <del>10000원</del>
      8000원
    </p>

    <!--
    sub
    -> 아래 첨자
    -->

    <p>H<sub>2</sub>O</p>

    <!--
    sup
    -> 위 첨자
    -->

    <p>10<sup>2</sup></p>

    <hr />

    <!--
    ==================================================
    3. Unordered List
    ==================================================

    ul
    -> 순서 없는 목록

    li
    -> 각각의 목록 항목
    -->

    <h2>Unordered List</h2>

    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>

    <!--
    ==================================================
    4. Ordered List
    ==================================================

    ol
    -> 순서 있는 목록
    -->

    <h2>Ordered List</h2>

    <ol>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ol>

    <!--
    ==================================================
    5. Nested List
    ==================================================

    목록 안에 또 다른 목록을 넣을 수 있다.

    하위 목록은 부모 li 안에 작성.
    -->

    <h2>Nested List</h2>

    <ul>
      <li>
        Web

        <ol>
          <li>HTML</li>
          <li>CSS</li>
        </ol>
      </li>
    </ul>

    <!--
    ==================================================
    6. Description List
    ==================================================

    dl
    -> description list 전체

    dt
    -> term
       설명할 단어

    dd
    -> description
       해당 단어의 설명
    -->

    <h2>Description List</h2>

    <dl>
      <dt>HTML</dt>

      <dd>웹 문서의 구조를 표현하는 언어</dd>

      <dt>CSS</dt>

      <dd>웹 문서의 스타일을 표현하는 언어</dd>
    </dl>
  </body>
</html>
