<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>HTML-1 Table</title>
  </head>

  <body>
    <!--
    ==================================================
    HTML-1 03 : TABLE
    ==================================================

    table
    -> 전체 표

    caption
    -> 표 제목

    thead
    -> 표 머리

    tbody
    -> 표 본문

    tfoot
    -> 표 마지막/요약

    tr
    -> table row
       한 행

    th
    -> table header
       제목 셀

    td
    -> table data
       일반 데이터 셀


    ★ 시험 중요 ★

    rowspan
    -> 여러 행을 합침
       세로 방향

    colspan
    -> 여러 열을 합침
       가로 방향
    -->

    <h1>학생 성적표</h1>

    <!--
    border="1"

    현재는 표 구조를 확인하기 위한 실습용.

    실제 디자인에서는 CSS로
    border를 지정하는 것이 권장된다.
    -->

    <table border="1">
      <caption>
        학생 성적
      </caption>

      <!-- 표 머리 -->

      <thead>
        <tr>
          <!--
                rowspan="2"

                현재 셀이 세로로
                2개의 행을 차지
                -->

          <th rowspan="2">이름</th>

          <!--
                colspan="2"

                현재 셀이 가로로
                2개의 열을 차지
                -->

          <th colspan="2">성적</th>
        </tr>

        <tr>
          <th>중간</th>
          <th>기말</th>
        </tr>
      </thead>

      <!-- 표 본문 -->

      <tbody>
        <tr>
          <td>철수</td>
          <td>90</td>
          <td>95</td>
        </tr>

        <tr>
          <td>영희</td>
          <td>80</td>
          <td>100</td>
        </tr>
      </tbody>

      <!-- 표 마지막/요약 -->

      <tfoot>
        <tr>
          <td>평균</td>
          <td>85</td>
          <td>97.5</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
