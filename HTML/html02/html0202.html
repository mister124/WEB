<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>HTML-2 입력 형식과 검증</title>
</head>

<body>

    <!--
    ==================================================
    HTML-2 02 : 입력 형식과 검증
    ==================================================

    [이번 파일 핵심]

    1. search
    2. tel
    3. pattern
    4. url
    5. range
    6. time
    7. datetime-local
    8. month
    9. week

    시험 중요도:

    ★★★ tel + pattern
    ★★★ url
    ★★  range
    ★★  time
    ★   search
    ★   datetime-local / month / week
    -->

    <h1>HTML-2 입력 형식과 검증</h1>

    <form>

        <!--
        ==================================================
        1. type="search"
        ==================================================

        검색어 입력용.

        기능적으로는 text와 매우 비슷하다.

        문제에서
        "검색어를 입력하는 입력창"
        이라고 하면 사용할 수 있다.
        -->

        <h2>1. Search</h2>

        <p>
            <label for="searchWord">검색어:</label>

            <input
                type="search"
                id="searchWord"
                name="searchWord"
                placeholder="검색어 입력"
            >
        </p>


        <!--
        ==================================================
        2. type="tel"
        ==================================================

        전화번호 입력용.

        중요:
        tel 자체는 전화번호 형식을 자동으로 검사하지 않는다.

        따라서 정확한 형식을 강제하려면
        pattern 속성과 함께 사용하는 경우가 많다.
        -->

        <h2>2. Telephone</h2>

        <p>
            <label for="phone">전화번호:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="010-1234-5678"
                pattern="010-[0-9]{4}-[0-9]{4}"
                required
            >
        </p>


        <!--
        ==================================================
        3. pattern
        ==================================================

        pattern
        = 입력값이 특정 형식과 일치하도록 제한

        아래 pattern:

        010-[0-9]{4}-[0-9]{4}

        의미:

        010-
        + 숫자 4개
        + -
        + 숫자 4개

        정상 예:
        010-1234-5678

        비정상 예:
        01012345678
        010-123-5678
        abc-defg-hijk
        -->


        <!--
        ==================================================
        4. type="url"
        ==================================================

        URL 입력용.

        브라우저는 URL "형식"을 검사한다.

        실제로 해당 웹사이트가 존재하는지까지
        확인하는 것은 아니다.

        예:
        https://www.google.com
        -->

        <h2>3. URL</h2>

        <p>
            <label for="homepage">홈페이지:</label>

            <input
                type="url"
                id="homepage"
                name="homepage"
                placeholder="https://example.com"
                required
            >
        </p>


        <!--
        ==================================================
        5. type="range"
        ==================================================

        범위 안에서 값을 선택하는 슬라이더.

        min   = 최소값
        max   = 최대값
        value = 초기값
        step  = 이동 단위

        예:
        0 ~ 100 점 사이 만족도 선택
        -->

        <h2>4. Range</h2>

        <p>
            <label for="score">만족도:</label>

            <input
                type="range"
                id="score"
                name="score"
                min="0"
                max="100"
                step="10"
                value="50"
            >

            0 ~ 100
        </p>


        <!--
        ==================================================
        6. type="time"
        ==================================================

        시간 입력용.

        시 / 분 등을 선택할 수 있다.

        문제에서:
        "시간을 선택하도록 한다"
        -> type="time"
        -->

        <h2>5. Time</h2>

        <p>
            <label for="meetingTime">회의 시간:</label>

            <input
                type="time"
                id="meetingTime"
                name="meetingTime"
            >
        </p>


        <!--
        ==================================================
        7. type="datetime-local"
        ==================================================

        날짜 + 시간을 한 번에 입력.

        예:
        2026-09-18 14:30

        datetime 이라는 옛 type과 혼동하지 말 것.

        현재는 datetime-local 사용.
        -->

        <h2>6. Date and Time</h2>

        <p>
            <label for="submitDateTime">
                제출 날짜와 시간:
            </label>

            <input
                type="datetime-local"
                id="submitDateTime"
                name="submitDateTime"
            >
        </p>


        <!--
        ==================================================
        8. type="month"
        ==================================================

        연도 + 월 선택.

        예:
        2026-09
        -->

        <h2>7. Month</h2>

        <p>
            <label for="startMonth">시작 월:</label>

            <input
                type="month"
                id="startMonth"
                name="startMonth"
            >
        </p>


        <!--
        ==================================================
        9. type="week"
        ==================================================

        연도 + 몇 번째 주인지 선택.

        예:
        2026-W38

        현재 시험 우선순위는 낮다.
        -->

        <h2>8. Week</h2>

        <p>
            <label for="studyWeek">학습 주차:</label>

            <input
                type="week"
                id="studyWeek"
                name="studyWeek"
            >
        </p>


        <hr>

        <!--
        ==================================================
        SUBMIT
        ==================================================

        submit을 눌러야
        required, pattern, url 등의
        브라우저 검증 결과를 직접 확인할 수 있다.
        -->

        <input
            type="submit"
            value="검증하기"
        >

        <input
            type="reset"
            value="초기화"
        >

    </form>

</body>

</html>
