<!doctype html>
<html lang="ko">
  <head>
    <!--
    ==================================================
    HTML-1 01 : HTML 기본 구조 / 텍스트 / 링크 / 이미지
    ==================================================
    -->

    <!-- 문자 인코딩 -->
    <meta charset="UTF-8" />

    <!-- 문서 설명 -->
    <meta name="description" content="HTML 실습 페이지입니다." />

    <!--
    브라우저 탭에 표시되는 제목.
    검색엔진에서도 페이지를 설명하는 데 이용될 수 있다.
    -->
    <title>HTML 실습</title>
  </head>

  <body>
    <!--
    ==================================================
    1. HTML 기본 구조
    ==================================================

    <!DOCTYPE html>
    -> 브라우저에게 HTML5 문서임을 알림

    <html>
    -> HTML 문서 전체

    <head>
    -> 문자셋, 제목, CSS, script 등 문서 정보

    <body>
    -> 실제 브라우저 화면에 표시되는 내용
    -->

    <!--
    ==================================================
    2. Paragraph
    ==================================================

    p = paragraph
    하나의 문단을 표현
    -->

    <p>Hello HTML!</p>

    <!--
    ==================================================
    3. Heading
    ==================================================

    h1 ~ h6

    단순히 글씨 크기를 정하는 태그가 아니다.
    페이지에서 제목의 구조와 중요도를 표현한다.

    h1이 가장 중요한 제목,
    h6으로 갈수록 하위 수준 제목.
    -->

    <h1>가장 중요한 제목</h1>
    <h2>두 번째 수준 제목</h2>
    <h3>세 번째 수준 제목</h3>
    <h4>네 번째 수준 제목</h4>
    <h5>다섯 번째 수준 제목</h5>
    <h6>여섯 번째 수준 제목</h6>

    <!--
    ==================================================
    4. Hyperlink
    ==================================================

    a = anchor

    href
    -> 이동할 목적지를 지정

    목적지는:
    - 웹페이지
    - 파일
    - 이메일 주소
    - 같은 페이지 내부 위치
    등이 될 수 있다.

    서버가 요청한 문서를 찾지 못하면
    흔히 404 오류가 발생한다.
    -->

    <h2>링크</h2>

    <p>
      <a href="https://www.google.com"> Google </a>
    </p>

    <!--
    mailto:
    -> 사용자의 기본 이메일 프로그램을 이용해
       이메일 작성을 시도
    -->

    <p>
      <a href="mailto:test@example.com"> 메일 보내기 </a>
    </p>

    <!--
    ==================================================
    5. Image
    ==================================================

    img
    -> 이미지 삽입

    src
    -> 이미지 파일 위치

    alt
    -> 이미지 대체 설명
       이미지 로딩 실패 및 접근성에 중요

    width / height
    -> 이미지 크기
    -->

    <h2>이미지</h2>

    <img src="cat.jpg" alt="고양이 사진" width="400" height="200" />

    <!--
    ==================================================
    6. 이미지를 링크로 사용
    ==================================================

    a 태그 안에 img를 넣으면
    이미지를 클릭했을 때 링크로 이동한다.
    -->

    <h2>이미지 링크</h2>

    <a href="https://www.google.com">
      <img src="cat.jpg" alt="고양이 사진" width="400" height="200" />
    </a>
  </body>
</html>
