<!-- browser에게 문서 형식 선언 -->
<!doctype html>
<!-- 문서 전체를 포함 -->
<html lang="ko">
  <head>
    <!-- 문자셋·제목·CSS·script 등의 문서 정보 -->
    <meta charset="UTF-8" />
    <meta name="description" content="HTML 실습 페이지입니다.">
    <!-- 브라우저 탭에 나타나고 검색엔진에서도 페이지를 설명하는 데 이용됩 -->
    <title>HTML 실습</title>
  </head>
  <!-- 실제 표시 콘텐츠 -->
  <body>
    <!-- paragraph = 문단 -->
    <p>Hello HTML!</p>
    <p>
        <!-- h1은 단순히 "글씨를 크게 만드는 태그"가 아님. 페이지의 구조와 중요도를 나타냄 -->
        <h1>가장 중요한 제목</h1>
        <h2>두 번째 수준 제목</h2>
        <h3>세 번째 수준 제목</h3>
        <h4>네 번째 수준 제목</h4>
        <h5>다섯 번째 수준 제목</h5>
        <h6>여섯 번째 수준 제목</h6>
    </p>
    <p>
        <!-- 하이퍼링크는 다른 자원으로 이동시키는 연결. 웹 브라우저는 기본적으로 텍스트 링크를 파란색/밑줄로 표시하는 경우가 많음. -->
        <!-- a는 anchor 요소이고, href가 목적지를 지정합니다. 목적지는 웹페이지뿐 아니라 파일이나 이메일 주소 등이 될 수 있습니다. 서버가 요청한 문서를 찾지 못하면 흔히 404 오류가 발생합니다. -->
        <a href="https://www.google.com">Google</a>
        <a href="mailto:test@example.com">메일 보내기</a>
    </p>
    <p>
        <img src="cat.jpg" alt="고양이 사진" width="400" height="200">
        <a href="https://www.google.com"><img src="cat.jpg" alt="고양이 사진" width="400" height="200"></a>
    </p>
    <p>
        <!-- character entity reference -->
        <!-- &lt; → <  &gt; → > &amp; → & &apos; -> ' &quot; → " &nbsp; → 공백 &copy; → © &mdash -> -- &ndash -> - -->
    </p>
    <p>
        <!-- 수평선 -->
        <hr>
        <!-- 취소선 -->
        <del>10000원</del>
        <!-- 아래 첨자 -->
        H<sub>2</sub>O
        <!-- 위 첨자 -->
        10<sup>2</sup>
    </p>
    <p>
        <!-- Unordered List -->
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
        <!-- Ordered List -->
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>
        <ul>
            <li>
                Web
                <ol>
                    <li>HTML</li>
                    <li>CSS</li>
                </ol>
            </li>
        </ul>
        <!-- Description List -->
        <dl>
            <!-- term, 설명할 단어 -->
            <dt>HTML</dt>
            <!-- description, 그 단어에 대한 설명 -->
            <dd>웹 문서의 구조를 표현하는 언어</dd>
        </dl>
    </p>
    <p>
        <!-- table  전체 표 -->
        <!-- border은 이중선 느낌 -> 실제로는 css 조작 권장 -->
        <table border="1">
            <!-- caption 표 제목 -->
            <caption>학생 성적</caption>
            <!-- thead  표의 머리 -->
            <thead>
                <!-- table row = 한 줄 -->
                <tr>
                    <!-- table header = 제목 셀 -->
                    <!-- rowspan = 행 합치기 colspan = 열 합치기 -->
                    <th rowspan="2">이름</th>
                    <th colspan="2">성적</th>
                </tr>
                <tr>
                    <th>중간</th>
                    <th>기말</th>
                </tr>
            </thead>
            <!-- tbody  표 본문 -->
            <tbody>
                <tr>
                    <!-- table data = 일반 데이터 셀 -->
                    <td>철수</td>
                    <td>90</td>
                    <td>95</td>
                </tr>
            </tbody>
            <!-- 표의 마지막/요약 -->
            <tfoot>
                <tr>
                    <td>평균</td>
                    <td>90</td>
                    <td>100</td>
                </tr>
            </tfoot>
        </table>
    </p>
    <p>
        <!-- Form 쉽게 말하면 온라인 신청서, 사용자의 정보를 수집하여 서버로 전송하기 위해 사용 -->
        <!-- method = 어떻게 보낼 것인가? action = 어디로 보낼 것인가? -->
        <!-- GET vs POST
        GET: 데이터가 ? 뒤의 query string으로 URL에 들어가므로 결과 URL을 공유하거나 다시 방문할 수 있다(ex. https://search.example.com/?query=html)
        POST: POST 데이터는 URL 뒤가 아니라 HTTP 요청의 body에 들어갑니다. 주소창에는 안 보인다. 하지만 비밀이 되는 것은 아니다. POST 본문은 개발자 도구에서 사용자가 확인하거나 수정할 수 있으며, 전송 중 내용을 보호하는 것은 HTTPS -->
        <form method="get" action="server.php">
            <!-- hidden input 사용자 화면에서는 안 보이지만 form이 전송될 때 같이 갑니다. 개발자 도구에서는 볼 수 있습니다. -->
            <input type="hidden" name="from" value="main-page">
            <!-- label 입력 창(<input>, <select>, <textarea> 등)이 어떤 정보를 받는 곳인지 설명. 레이블 텍스트를 마우스로 클릭해도 연결된 입력 필드가 선택되거나 체크박스가 토글 -->
            <label>
                Name:
                <!-- text input 일반 텍스트 입력. 보이는 입력창 크기. 입력할 수 있는 최대 문자 수. value로 기본값 설정 가능 -->
                <input type="text" name="username" value="hi" size="20" maxlength="10">
            </label>
            <!-- submit / reset form 전송, 현재 입력값을 처음 상태로 되돌림 -->
            <input type="submit" value="제출">
            <input type="reset" value="초기화">
            <!-- 줄바꿈 -->
            <br>
            <!-- password 브라우저 화면에는 입력 문자가 가려집니다. -->
            <input type="password" name="password">
            <!-- textarea 일반 <input>과 다르게 여러 줄을 입력. 서버에서 값을 식별하려면 name이 필요하고, textarea는 별도의 value 속성 대신 태그 사이 내용을 사용 -->
            <textarea name="comment" rows="5" cols="30">기본 내용</textarea>
            <!-- checkbox 여러 개 선택 가능 -->
            <label>
                <input type="checkbox" name="language" value="html"> HTML
            </label>
            <label>
                <input type="checkbox" name="language" value="css"> CSS
            </label>
            <!-- radio 한 그룹에서 하나만 선택하게 할 때 사용. adio 그룹은 동일한 name, 서로 다른 value -->
            <label>
                <input type="radio" name="grade" value="1"> 1학년
            </label>
            <label>
                <input type="radio" name="grade" value="2"> 2학년
            </label>
            <!-- select / option -->
            <select name="grade">
                <option value="1">1학년</option>
                <option value="2" selected>2학년</option>
                <option value="3">3학년</option>
            </select>
        </form>
    </p>
    <p>
        <button>버튼</button>
        <input type="button" value="버튼">
    </p>
    <p>
        <!-- Internal Linking -->
        <h2 id="database">Database</h2>
        <a href="#database">Database로 이동</a>
    </p>
  </body>
</html>
