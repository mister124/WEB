<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>참가 신청 | 2026 Campus Web Seminar</title>
  </head>

  <body>
    <header>
      <p>
        <a href="index.html">2026 Campus Web Seminar</a>
      </p>

      <nav>
        <ul>
          <li>
            <a href="index.html">행사 안내</a>
          </li>
          <li>
            <a href="apply.html">참가 신청</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>참가 신청</h1>

      <p>참가 정보를 입력한 후 신청 버튼을 누르세요.</p>

      <form method="get" action="apply.html">
        <p>
          <label for="name"> 이름 </label>

          <input type="text" id="name" name="name" required />
        </p>

        <p>
          <label for="student-id"> 학번 </label>

          <input type="text" id="student-id" name="student-id" />
        </p>

        <p>
          <label for="email"> 이메일 </label>

          <input type="email" id="email" name="email" required />
        </p>

        <fieldset>
          <legend>참가 유형</legend>

          <p>
            <input
              type="radio"
              id="individual"
              name="participation-type"
              value="individual"
            />

            <label for="individual"> 개인 참가 </label>

            <input
              type="radio"
              id="team"
              name="participation-type"
              value="team"
            />

            <label for="team"> 팀 참가 </label>
          </p>
        </fieldset>

        <p>
          <label for="interest"> 관심 분야 </label>

          <select id="interest" name="interest">
            <option value="">선택하세요</option>

            <option value="html">HTML</option>

            <option value="css">CSS</option>

            <option value="javascript">JavaScript</option>
          </select>
        </p>

        <p>
          <input
            type="checkbox"
            id="agreement"
            name="agreement"
            value="yes"
            required
          />

          <label for="agreement"> 행사 참가에 동의합니다. </label>
        </p>

        <p>
          <input type="submit" id="submit" name="submit" value="신청하기" />
        </p>
      </form>
    </main>

    <footer>
      <p>2026 Campus Web Seminar</p>
    </footer>
  </body>
</html>
